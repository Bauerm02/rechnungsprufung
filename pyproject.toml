[build-system]
requires = ["hatchling>=1.24.0"]
build-backend = "hatchling.build"

[project]
name = "invoice-automation"
version = "0.1.0"
description = "Phase 1 scaffold for a production-grade invoice automation service."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [
  { name = "Codex" },
]
dependencies = [
  "fastapi>=0.110,<1.0",
  "fpdf2>=2.8.5,<3.0",
  "httpx>=0.27,<1.0",
  "pydantic>=2.6,<3.0",
  "pydantic-settings>=2.2,<3.0",
  "pypdf>=5.0,<7.0",
  "python-multipart>=0.0.9,<1.0",
  "sqlalchemy>=2.0,<3.0",
  "structlog>=24.1,<25.0",
  "uvicorn>=0.29,<1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9.0",
  "pytest-cov>=5.0,<6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/invoice_automation", "src/mietinkasso"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"

